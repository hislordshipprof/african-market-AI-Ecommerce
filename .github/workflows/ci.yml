name: CI

# Hosted CI runs on demand only, to save GitHub Actions minutes. The everyday gate is scripts/ci-local.sh,
# which runs these same checks locally and records a "local-ci" commit status. The coordinator adds the
# "run-ci" label for milestone PRs (money, auth, data isolation), or starts a run by hand (workflow_dispatch).
# Pushes to PR branches and to main do not trigger it.
on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job: install, migrate, seed and build once, then unit tests and e2e (the old ci + e2e jobs did all of that twice).
  ci:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app_owner:app_owner@localhost:5432/test_db
      DIRECT_URL: postgresql://app_owner:app_owner@localhost:5432/test_db
      APP_RUNTIME_PASSWORD: app_runtime_ci
      BETTER_AUTH_SECRET: ci-e2e-test-secret-do-not-use-in-prod
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      SEED_TEST_ADMIN: "1"
      SEED_ADMIN_PASSWORD: CiTestPass99!
      SEED_ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXP
      AUTH_RATE_LIMIT_RELAXED: "1"
      E2E_STORE_OVERRIDE: "1"
      E2E_FAKE_STRIPE: "1"
      E2E_FAKE_ADDRESS: "1"
      ASSISTANT_CHAT_ENABLED: "1"
      E2E_FAKE_ASSISTANT: "1"
      ANTHROPIC_API_KEY: e2e-fake-anthropic-key
      NEXT_PUBLIC_DEMO_FLOWS: "1"
      STOREFRONT_REVALIDATION_SECRET: e2e-storefront-revalidate

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database roles and extensions
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_db <<SQL
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE ROLE app_owner LOGIN PASSWORD 'app_owner' CREATEROLE;
            GRANT ALL PRIVILEGES ON DATABASE test_db TO app_owner;
            ALTER SCHEMA public OWNER TO app_owner;
            CREATE ROLE app_runtime LOGIN PASSWORD 'app_runtime_ci' NOSUPERUSER NOBYPASSRLS;
          SQL

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npx next start -p 3000 > /tmp/next-stdout.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:3000/ 2>/dev/null; then
              echo "Server ready after $((i*2))s"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "::error::Server process exited unexpectedly"
              cat /tmp/next-stdout.log
              exit 1
            fi
            sleep 2
          done

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Show server logs
        if: always()
        run: |
          echo "=== next start output ==="
          cat /tmp/next-stdout.log 2>/dev/null || echo "(no output)"
          kill $SERVER_PID 2>/dev/null || true

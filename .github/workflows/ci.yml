name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database owner role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_db <<SQL
            CREATE ROLE app_owner LOGIN PASSWORD 'app_owner' CREATEROLE;
            GRANT ALL PRIVILEGES ON DATABASE test_db TO app_owner;
            ALTER SCHEMA public OWNER TO app_owner;
          SQL

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: postgresql://app_owner:app_owner@localhost:5432/test_db

      - name: Seed database
        run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://app_owner:app_owner@localhost:5432/test_db
          DIRECT_URL: postgresql://app_owner:app_owner@localhost:5432/test_db

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://app_owner:app_owner@localhost:5432/test_db

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://app_owner:app_owner@localhost:5432/test_db
          DIRECT_URL: postgresql://app_owner:app_owner@localhost:5432/test_db

  e2e:
    runs-on: ubuntu-latest
    needs: ci

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://app_owner:app_owner@localhost:5432/test_db
      DIRECT_URL: postgresql://app_owner:app_owner@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup database owner role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d test_db <<SQL
            CREATE ROLE app_owner LOGIN PASSWORD 'app_owner' CREATEROLE;
            GRANT ALL PRIVILEGES ON DATABASE test_db TO app_owner;
            ALTER SCHEMA public OWNER TO app_owner;
          SQL

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Build application
        run: pnpm build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline</title>
<style>
  :root { color-scheme: light dark; --bg:#F3F4EF; --surface:#FFFFFF; --ink:#15201A; --muted:#55625A; --line:#DCDFD6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#101512; --surface:#18201B; --ink:#EEF2EC; --muted:#AEB8B0; --line:#4A564E; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(100%, 420px); padding: 28px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  svg { display: block; margin-bottom: 16px; color: var(--muted); }
  h1 { font-size: 22px; line-height: 1.25; letter-spacing: -0.3px; }
  p { margin-top: 8px; color: var(--muted); font-size: 15px; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 20px; padding: 12px 24px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--ink); font-weight: 650; text-decoration: none; }
  a:focus-visible { outline: 3px solid currentColor; outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-1.4-1.04"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
  <h1>You're offline</h1>
  <p>This page needs a connection. Your cart and orders are safe: nothing here is stored on this device. Check your signal and try again.</p>
  <a href="">Try again</a>
</main>
</body>
</html>
